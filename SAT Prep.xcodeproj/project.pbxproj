		A1B2C3D4E5F60001 /* Validate Question Data */ = {
			isa = PBXShellScriptBuildPhase;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
				"$(SRCROOT)/SAT Prep/opensat_cleaned.json",
				"$(SRCROOT)/SAT Prep/vocab_questions.json",
			);
			name = "Validate Question Data";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "python3 - \"$SRCROOT\" << 'PYEOF'\nimport json, re, sys, os\n\nSRCROOT = sys.argv[1]\nFILES = [\n    os.path.join(SRCROOT, 'SAT Prep', 'opensat_cleaned.json'),\n    os.path.join(SRCROOT, 'SAT Prep', 'vocab_questions.json'),\n]\nREQUIRED = ['id', 'text', 'options', 'correctIndex', 'explanation']\nSKIP = {'0','1','2','3','4','90','180','360'}\n\ndef norm(s): return re.sub(r'\\s+',' ',s.strip().lower())\ndef final_ans(e):\n    m = re.findall(r'(?:=|is|are)\\s+([-]?\\d+(?:\\.\\d+)?)', e)\n    return m[-1] if m else None\ndef in_opts(a, opts):\n    for o in opts:\n        if a in re.findall(r'[-]?\\d+(?:\\.\\d+)?', o): return True\n    return False\ndef all_num(opts):\n    return all(bool(re.match(r'^[-]?\\d+(\\.\\d+)?(\\u221a\\(?\\w+\\)?)?$', o.strip().replace(' ',''))) for o in opts)\ndef mentioned(e, opts):\n    ne = norm(e)\n    hits=[i for i,o in enumerate(opts) if len(norm(o))>=8 and norm(o) in ne]\n    return hits[0] if len(hits)==1 else None\n\nerrors = []\nfor path in FILES:\n    if not os.path.exists(path):\n        print(f'error: {path}: file not found'); errors.append(1); continue\n    qs = json.load(open(path))\n    seen = set()\n    fname = os.path.basename(path)\n    for q in qs:\n        qid=q.get('id','?'); text=q.get('text',''); opts=q.get('options',[])\n        cidx=q.get('correctIndex',-1); expl=q.get('explanation',''); subj=q.get('subject','')\n        pre=f'{fname}: question \"{text[:60]}\"'\n        for f in REQUIRED:\n            if f not in q:\n                print(f'error: {pre}: missing field {f}'); errors.append(1)\n        if qid in seen:\n            print(f'error: {fname}: duplicate id {qid}'); errors.append(1)\n        seen.add(qid)\n        if not isinstance(cidx,int) or cidx<0 or cidx>=len(opts):\n            print(f'error: {pre}: correctIndex={cidx} out of bounds ({len(opts)} options)'); errors.append(1); continue\n        m=mentioned(expl,opts)\n        if m is not None and m!=cidx:\n            print(f'error: {pre}: explanation mentions opt {m} (\"{opts[m][:40]}\") but correctIndex={cidx} (\"{opts[cidx][:40]}\")'); errors.append(1)\n        if subj=='Math' and all_num(opts):\n            fa=final_ans(expl)\n            if fa and fa not in SKIP and not in_opts(fa,opts):\n                kws=['therefore','discriminant is','answer is','value is','result is','= '+fa]\n                if any(k in expl.lower() for k in kws):\n                    print(f'error: {pre}: explanation states {fa} not in options {opts}'); errors.append(1)\nif errors:\n    print(f'\\nerror: Question data validation FAILED — {len(errors)} issue(s). Fix before shipping.')\n    sys.exit(1)\nelse:\n    print('note: Question data validation passed OK')\nPYEOF\n";
			showEnvVarsInLog = 0;
		};
